name: Deploy

on:
  push:
    branches: [canary]
  workflow_dispatch:
    inputs:
      deploy_platform:
        description: 部署平台（push canary 自动部署 Cloudflare；若 EO_PROJECT_NAME/EO_API_TOKEN 均已配置则同时自动部署 EdgeOne。手动触发时可选平台，DB_TYPE 与 DATABASE_URL 在 Makers 控制台项目环境变量中配置，需为 tidb/pg）
        type: choice
        options:
          - cf
          - edgeone
          - both
        default: cf

permissions:
  contents: read
  deployments: write

jobs:
  # ==================== Cloudflare 部署 ====================
  deploy-cf:
    name: Deploy Cloudflare
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/canary') ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_platform == 'cf' || inputs.deploy_platform == 'both'))
    runs-on: ubuntu-latest
    env:
      DEPLOY_PLATFORM: cf
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./placeholder.db' }}
      DB_TYPE: ${{ secrets.DB_TYPE || 'd1' }}
      # 版本选择（仓库变量）：latest（默认，全量 Worker）或 lite（精简 Worker：仅负载均衡 + 模型发现 + 写日志，最小化 CPU）
      VERSION: ${{ vars.VERSION || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      # ==================== 环境准备 ====================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install requests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # ==================== 获取 Account ID ====================

      - name: Fetch Account ID
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          else
            ACCOUNT_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" | jq -r '.result[0].id')
            if [[ -z "$ACCOUNT_ID" ]] || [[ "$ACCOUNT_ID" == "null" ]]; then
              echo "✗ 无法获取账户 ID，请检查 CLOUDFLARE_API_TOKEN"
              exit 1
            fi
          fi
          echo "::add-mask::${ACCOUNT_ID}"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "✓ Account ID 已获取"

      # ==================== 部署前：初始化资源（D1/KV/Hyperdrive 按需） ====================

      - name: Init Resources (pre)
        id: init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          D1_NAME: fiammetta_d1
          KV_NAME: fiammetta-proxy
          HYPERDRIVE_NAME: fiammetta-hyperdrive
        run: python3 deploy/init.py pre

      # ==================== 安装依赖 & 构建 ====================

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: node scripts/prepare-db.mjs

      - name: Check Prisma Multi-Dialect Config
        run: python3 deploy/init.py check

      - name: Build Pages
        run: |
          # 复用 build:cf：含 DEPLOY_PLATFORM=cf 构建门控（临时移除 v1/cron 路由）+ prepare-db + 产物处理
          npm run build:cf
          echo "✓ Pages 构建完成（build-gate 已移除 v1/cron 路由）"

      # ==================== 部署 Worker ====================

      # VERSION=lite 时切换为精简 Worker（仅负载均衡 + 模型发现 + 写日志）；latest 为 no-op
      - name: Worker Lite Gate
        run: bash scripts/worker-lite-gate.sh

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          cd worker
          npx wrangler deploy --config wrangler.toml 2>&1 | grep -v "https://"
          echo "✓ Worker 部署完成"

      # ==================== 部署后：Pages 绑定 + Secrets ====================

      - name: Init Pages + Secrets (post)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          D1_ID: ${{ steps.init.outputs.D1_ID }}
          KV_ID: ${{ steps.init.outputs.KV_ID }}
          HYPERDRIVE_ID: ${{ steps.init.outputs.HYPERDRIVE_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python3 deploy/init.py post

      # ==================== 部署 Pages ====================

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          # 让 wrangler 在本地日志输出脱敏后的 API 响应体（含 deployment 失败详情，token 自动打码）
          WRANGLER_LOG_SANITIZE: "false"
        run: |
          set -o pipefail
          npx wrangler pages deploy .open-next --project-name fiammetta-watcher --branch main 2>&1 | grep -v "https://" || {
            echo "✗ wrangler pages deploy 失败，wrangler 本地日志尾部（脱敏）："
            ls -t ~/.config/.wrangler/logs/wrangler-*.log 2>/dev/null | head -1 | xargs -I{} sh -c 'tail -120 "{}" | grep -vE "^Uploading|https://" | tail -50'
            echo "✗ wrangler pages deploy 失败，最近部署的 Cloudflare 构建日志："
            python3 - "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" <<'PYEOF' | grep -v "https://" | tail -60
          import json, sys, urllib.request

          account_id, token = sys.argv[1], sys.argv[2]

          def api(path):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account_id}{path}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              return json.load(urllib.request.urlopen(req))

          try:
              deps = api("/pages/projects/fiammetta-watcher/deployments?per_page=3")["result"]
              for dep in deps:
                  stage = dep.get("latest_stage", {})
                  print(f"deployment {dep['id']} stage={stage.get('name')} status={stage.get('status')}")
                  # 完整 dump（移除 url 字段，否则含 https:// 的整行会被脱敏管道过滤）
                  dep_no_url = {k: v for k, v in dep.items() if k != "url"}
                  print("  dep full:", json.dumps(dep_no_url, default=str)[:1500])
                  dep_err = dep.get("error")
                  stage_err = stage.get("error")
                  if dep_err:
                      print("  ! deployment error:", json.dumps(dep_err)[:400])
                  if stage_err:
                      print("  ! stage error:", json.dumps(stage_err)[:400])
                  try:
                      resp = api(f"/pages/projects/fiammetta-watcher/deployments/{dep['id']}/history/logs?size=200")
                      logs = resp.get("result") or {}
                      data = logs.get("data") or []
                      if not data:
                          print("  ! history/logs 无日志，响应:", json.dumps(resp)[:400])
                      for item in data[-15:]:
                          line = (item.get("line") or "").strip()
                          if line:
                              print("  |", line[:400])
                  except Exception as err:
                      print("  ! 构建日志获取失败:", err)
          except Exception as err:
              print("! 部署列表获取失败:", err)
          PYEOF
            exit 1
          }
          echo "✓ Pages 部署完成"

      # ==================== 部署后：设置 Pages 环境变量（必须在 pages deploy 之后） ====================

      - name: Set Pages Vars (post-deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          D1_ID: ${{ steps.init.outputs.D1_ID }}
          KV_ID: ${{ steps.init.outputs.KV_ID }}
          HYPERDRIVE_ID: ${{ steps.init.outputs.HYPERDRIVE_ID }}
        run: python3 deploy/init.py post-deploy

      # ==================== 部署后：Worker Cron 触发器独立配置 ====================
      # 必须在 Deploy Pages 之后：CF API 覆盖式 PUT crons 到 Worker，若放在 wrangler
      # deploy 之前会被部署覆盖；从 wrangler.toml 顶部 [triggers] 段移出后改为
      # init.py 逐条 PUT，单条失败不阻断其他，避免 CF 免费计划账户级 Cron Triggers
      # 上限 5 条硬限——再加一条 wrangler deploy 直接报错

      - name: Run cron-setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          # 传入 VERSION（仓库变量）让 init.py cron-setup 阶段按 latest/lite
          # 裁剪注入条数：lite 仅 1 条（model-fetch），避免占满 5 条配额
          VERSION: ${{ vars.VERSION || 'latest' }}
        run: python3 deploy/init.py cron-setup

      # ==================== 完成 ====================

      - name: Done
        run: echo "✓ Cloudflare 部署完成"

  # ==================== EdgeOne Makers 部署 ====================
  # push canary：若 EO_PROJECT_NAME 与 EO_API_TOKEN 均已配置，自动与 Cloudflare 同时部署（secrets 无法在 if 中判断，用 step 输出标记）
  # workflow_dispatch：按 deploy_platform 选择（edgeone/both）部署
  deploy-edgeone:
    name: Deploy EdgeOne Makers
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/canary') ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_platform == 'edgeone' || inputs.deploy_platform == 'both'))
    runs-on: ubuntu-latest
    env:
      DEPLOY_PLATFORM: edgeone
      EO_PROJECT_NAME: ${{ secrets.EO_PROJECT_NAME }}
      EO_API_TOKEN: ${{ secrets.EO_API_TOKEN }}
    steps:
      - name: Check EdgeOne Secrets
        id: eo_check
        run: |
          if [[ -n "$EO_PROJECT_NAME" && -n "$EO_API_TOKEN" ]]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠ EO_PROJECT_NAME / EO_API_TOKEN 未配置，跳过 EdgeOne 部署"
          fi

      - uses: actions/checkout@v4
        if: steps.eo_check.outputs.can_deploy == 'true'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        if: steps.eo_check.outputs.can_deploy == 'true'

      # ==================== 部署（EdgeOne CLI 自动安装依赖、构建并上传） ====================

      - name: Deploy to EdgeOne Makers
        if: steps.eo_check.outputs.can_deploy == 'true'
        # 部署逻辑在脚本内（含日志脱敏过滤），避免 run 命令文本暴露变量名
        run: bash .github/scripts/deploy-edgeone.sh
