name: Deploy

on:
  push:
    branches: [canary]
  workflow_dispatch:
    inputs:
      deploy_platform:
        description: 部署平台（push canary 自动部署 Cloudflare；EdgeOne 仅手动触发，需配置 EO_PROJECT_NAME/EO_API_TOKEN secrets，DB_TYPE 与 DATABASE_URL 在 Makers 控制台项目环境变量中配置，需为 tidb/pg）
        type: choice
        options:
          - cf
          - edgeone
          - both
        default: cf

jobs:
  # ==================== Cloudflare 部署 ====================
  deploy-cf:
    name: Deploy Cloudflare
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/canary') ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_platform == 'cf' || inputs.deploy_platform == 'both'))
    runs-on: ubuntu-latest
    env:
      DEPLOY_PLATFORM: cf
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./placeholder.db' }}
      DB_TYPE: ${{ secrets.DB_TYPE || 'd1' }}
    steps:
      - uses: actions/checkout@v4

      # ==================== 环境准备 ====================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install requests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # ==================== 获取 Account ID ====================

      - name: Fetch Account ID
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          else
            ACCOUNT_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" | jq -r '.result[0].id')
            if [[ -z "$ACCOUNT_ID" ]] || [[ "$ACCOUNT_ID" == "null" ]]; then
              echo "✗ 无法获取账户 ID，请检查 CLOUDFLARE_API_TOKEN"
              exit 1
            fi
          fi
          echo "::add-mask::${ACCOUNT_ID}"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "✓ Account ID 已获取"

      # ==================== 部署前：初始化资源（D1/KV/Hyperdrive 按需） ====================

      - name: Init Resources (pre)
        id: init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          D1_NAME: fiammetta_d1
          KV_NAME: fiammetta-proxy
          HYPERDRIVE_NAME: fiammetta-hyperdrive
        run: python3 deploy/init.py pre

      # ==================== 安装依赖 & 构建 ====================

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: node scripts/prepare-db.mjs

      - name: Check Prisma Multi-Dialect Config
        run: python3 deploy/init.py check

      - name: Build Pages
        run: |
          # 复用 build:cf：含 DEPLOY_PLATFORM=cf 构建门控（临时移除 v1/cron 路由）+ prepare-db + 产物处理
          npm run build:cf
          echo "✓ Pages 构建完成（build-gate 已移除 v1/cron 路由）"

      # ==================== 部署 Worker ====================

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          cd worker
          npx wrangler deploy --config wrangler.toml 2>&1 | grep -v "https://"
          echo "✓ Worker 部署完成"

      # ==================== 部署后：Pages 绑定 + Secrets ====================

      - name: Init Pages + Secrets (post)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          D1_ID: ${{ steps.init.outputs.D1_ID }}
          KV_ID: ${{ steps.init.outputs.KV_ID }}
          HYPERDRIVE_ID: ${{ steps.init.outputs.HYPERDRIVE_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python3 deploy/init.py post

      # ==================== 部署 Pages ====================

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx wrangler pages deploy .open-next --project-name fiammetta-watcher --branch main 2>&1 | grep -v "https://"
          echo "✓ Pages 部署完成"

      # ==================== 部署后：设置 Pages 环境变量（必须在 pages deploy 之后） ====================

      - name: Set Pages Vars (post-deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          D1_ID: ${{ steps.init.outputs.D1_ID }}
          KV_ID: ${{ steps.init.outputs.KV_ID }}
          HYPERDRIVE_ID: ${{ steps.init.outputs.HYPERDRIVE_ID }}
        run: python3 deploy/init.py post-deploy

      # ==================== 完成 ====================

      - name: Done
        run: echo "✓ Cloudflare 部署完成"

  # ==================== EdgeOne Makers 部署 ====================
  deploy-edgeone:
    name: Deploy EdgeOne Makers
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_platform == 'edgeone' || inputs.deploy_platform == 'both'))
    runs-on: ubuntu-latest
    env:
      DEPLOY_PLATFORM: edgeone
    steps:
      - uses: actions/checkout@v4

      # ==================== 环境准备 ====================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==================== 部署（EdgeOne CLI 自动安装依赖、构建并上传） ====================

      - name: Deploy to EdgeOne Makers
        env:
          EO_PROJECT_NAME: ${{ secrets.EO_PROJECT_NAME }}
          EO_API_TOKEN: ${{ secrets.EO_API_TOKEN }}
        # 部署逻辑在脚本内（含日志脱敏过滤），避免 run 命令文本暴露变量名
        run: bash .github/scripts/deploy-edgeone.sh
