name: third-party-code-scanning

on:
  push:
    branches:
      - canary
      - main
      - stable
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Semgrep (JS/TS/Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --metrics=off \
            --config p/security-audit \
            --sarif \
            -o semgrep.sarif \
            .
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  eslint-security:
    name: ESLint Security (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm ci

      - name: Run ESLint with security plugins
        run: |
          npx eslint pages/ lib/ src/ worker/src/ \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-security.sarif
        continue-on-error: true

      - name: Upload ESLint SARIF
        if: always() && hashFiles('eslint-security.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-security.sarif
          category: eslint-security
