services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期生成对应方言的 Prisma Client，必须与运行时 DB_TYPE 一致
        DB_TYPE: pg
    container_name: fiammetta-watcher-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      # 声明生产环境：登录 Cookie 附加 Secure、CSRF 校验走 isProd 分支
      - ENVIRONMENT=production
      # 部署平台：Docker 直连部署，客户端可直达容器（无边缘注入可信头），
      # 登录限流等 IP 解析只信任 TCP 对端，忽略所有前置头
      - DEPLOY_PLATFORM=docker
      - PORT=${PORT:-3000}
      # 数据库类型：容器内置 PostgreSQL，固定 pg
      - DB_TYPE=pg
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fwp}:${POSTGRES_PASSWORD:?请在 .env 文件中设置数据库密码}@db:5432/${POSTGRES_DB:-fiammetta_proxy}
      # 管理后台登录账号（环境变量认证，无需初始化）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在 .env 文件中设置管理员密码}
      # JWT 密钥：必须设置且不少于 32 字符，否则无法登录
      - JWT_SECRET=${JWT_SECRET:?请在 .env 文件中设置 JWT_SECRET（至少 32 字符）}
      # Cron 认证（可选但推荐，未配置时 /api/cron/* 端点返回 403 禁用）
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    # 容器安全加固：禁止提升权限、移除所有 Linux capabilities
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 资源限制：防止容器占用过多内存和 CPU
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    # 健康检查：定期检测应用是否正常响应
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - app_data:/app/data

  db:
    image: postgres:16-alpine
    container_name: fiammetta-proxy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fwp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 文件中设置数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:-fiammetta_proxy}
    # 安全加固：数据库端口仅绑定 127.0.0.1，禁止外部直接访问
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fwp}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  app_data:
