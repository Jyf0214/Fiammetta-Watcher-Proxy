name = "fiammetta_worker"
main = "src/index.ts"
compatibility_date = "2025-04-02"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

# 环境变量（通过 Cloudflare Dashboard 或 wrangler secret 设置）
[vars]
DB_TYPE = "d1"
# 运行时部署平台标识：请求日志 nodeName 未设置 NODE_NAME 时回退为友好平台名
# （Cloudflare）。构建期 build-gate 的 DEPLOY_PLATFORM 只作用于构建产物，不会
# 进入 Worker 运行时——此处显式注入，否则 CF 部署日志恒显示 local
DEPLOY_PLATFORM = "cf"
# TIDB_URL = ""      # TiDB Cloud 连接串（DB_TYPE=tidb 时设置）
# PG_URL = ""        # PostgreSQL 直连串（DB_TYPE=pg 时设置）

# D1 数据库绑定（Worker 和 Pages 共享同一个 D1）
[[d1_databases]]
binding = "DB"
database_name = "fiammetta_d1"
database_id = "placeholder-d1-id"  # 部署时由 Terraform/CI 替换

# KV 命名空间绑定（仅 Worker 使用：速率限制 + 熔断器状态缓存）
[[kv_namespaces]]
binding = "KV"
id = "placeholder-kv-id"  # 部署时由 Terraform/CI 替换

# Hyperdrive 绑定（DB_TYPE=hyperdrive 时启用，提供 PostgreSQL 连接池加速）
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "placeholder-hyperdrive-id"  # 部署时由 CI 替换

# Cron 定时任务（4 条：Cloudflare Workers 免费计划账户级 Cron Triggers 上限为 5，
# 且代理拉取/健康检查仅 Docker 部署生效（pullProxyGroups 对 DEPLOY_PLATFORM!=docker
# 直接空返回），CF 上保留只会在配额内空转）
# 每小时：Key 用量重置检查
# 每 6 小时：平台模型发现
# 每天凌晨 3 点：日志归档 + 加密配置备份推送（同一槽位组合执行；
#   备份需 BACKUP_WEBHOOK_URL + BACKUP_ENCRYPTION_KEY，未配置自动跳过。
#   原独立槽位 3:17 因配额上限移除，两任务操作不同表、waitUntil 独立执行）
# 每 5 分钟：出站代理健康检查（仅 Docker 部署且未禁用时生效）
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 */6 * * *", "0 */1 * * *", "0 3 * * *", "*/5 * * * *"]
